[package]
name = "rnp-python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bindings exposing rnp-core as the `_rnp` extension module"

[lib]
name = "_rnp"
crate-type = ["cdylib", "rlib"]

[dependencies]
rnp-core = { path = "../rnp-core" }
num-complex.workspace = true
pyo3 = { version = "0.29", features = ["num-complex"] }

[features]
# Enabled by maturin (see pyproject.toml). Off by default so that plain
# `cargo test` can link the test harness against libpython.
extension-module = ["pyo3/extension-module"]
