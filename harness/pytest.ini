# pytest config for running UPSTREAM tests against the port.
#
# upstream/pytest.ini enables --strict-markers, and the markers themselves are
# registered by upstream/numpy/conftest.py -- which we cannot load, because it
# imports C extension modules the port has no equivalent for. Registering the
# same markers here keeps the upstream test files unmodified while letting
# collection succeed.
#
# Warnings are NOT turned into errors here (upstream does that), because the
# port emits none of numpy's warnings yet; that would turn every M0 gap into
# an error and hide real signal.
[pytest]
addopts = -ra
markers =
    valgrind_error: Tests that are known to error under valgrind.
    leaks_references: Tests that are known to leak references.
    slow: Tests that are very slow.
    parallel_threads(n): run the given test function in parallel using `n` threads.
    iterations(n): run the given test function `n` times in each thread
    thread_unsafe: mark the test function as single-threaded
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS ALLOW_UNICODE ALLOW_BYTES
